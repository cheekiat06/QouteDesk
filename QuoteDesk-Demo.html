<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuoteDesk — prototype demo for Exclusive Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --panel-2:#F6F8FB; --ink:#14233A; --text:#213044; --muted:#5B6B7F;
  --line:#D5DDE8; --line-2:#E6EBF2; --navy:#14355E; --navy-ink:#FFFFFF; --teal:#0B7A8A; --teal-soft:#E1F2F4;
  --amber:#B8660A; --amber-soft:#FFF3E0; --green:#1C7A4B; --green-soft:#E4F3EA; --red:#B4231B; --red-soft:#FCEBE9;
  --chat-bg:#E9EDF2; --bubble-in:#FFFFFF; --bubble-out:#DCEFE6; --shadow:0 1px 2px rgba(20,35,58,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1520; --panel:#161F2C; --panel-2:#1B2533; --ink:#EEF2F7; --text:#DCE4EE; --muted:#9DAABB;
    --line:#2A3647; --line-2:#222D3C; --navy:#1E3F6C; --navy-ink:#FFFFFF; --teal:#4EC3D1; --teal-soft:#123840;
    --amber:#F0B341; --amber-soft:#3A2A10; --green:#5CC68B; --green-soft:#143524; --red:#F08A80; --red-soft:#3D1A17;
    --chat-bg:#111926; --bubble-in:#1E2938; --bubble-out:#1F3B33; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1520; --panel:#161F2C; --panel-2:#1B2533; --ink:#EEF2F7; --text:#DCE4EE; --muted:#9DAABB;
  --line:#2A3647; --line-2:#222D3C; --navy:#1E3F6C; --navy-ink:#FFFFFF; --teal:#4EC3D1; --teal-soft:#123840;
  --amber:#F0B341; --amber-soft:#3A2A10; --green:#5CC68B; --green-soft:#143524; --red:#F08A80; --red-soft:#3D1A17;
  --chat-bg:#111926; --bubble-in:#1E2938; --bubble-out:#1F3B33; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;color:var(--ink);line-height:1.25}
h1{font-size:20px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tnum{font-variant-numeric:tabular-nums}
.strong{font-weight:600;color:var(--ink)}

/* layout */
.app{min-height:100%;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--navy-ink);padding:10px 20px env(safe-area-inset-top,0px);padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em}
.brand .mark{width:30px;height:30px;border-radius:7px;background:#FFFFFF;color:#14355E;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand .sub{font-weight:400;opacity:.85}
.topbar .spacer{flex:1}
.topbar label{font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:8px}
.topbar select{background:#FFFFFF;color:#14233A;border:0;border-radius:7px;padding:7px 10px;font-size:13px;color-scheme:light}
.demo-pill{font-size:12px;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px 9px;opacity:.95}

.stepper{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;color:var(--text)}
.step:hover{background:var(--panel-2)}
.step[aria-current="page"]{background:var(--teal-soft);color:var(--ink)}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel)}
.step[aria-current="page"] .n{border-color:var(--teal);color:var(--teal)}
.step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step .t{font-weight:500;font-size:13.5px;line-height:1.25}
.step .d{font-size:11.5px;color:var(--muted)}
.stepper .foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--muted)}

.stage{padding:22px 24px 40px;max-width:1360px;width:100%}
.stage-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.stage-head .lead{max-width:720px}
.stage-head p{margin-top:4px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.grid{display:grid;gap:18px}
.grid.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.grid.phone-side{grid-template-columns:380px minmax(0,1fr)}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1040px){.grid.two,.grid.phone-side,.grid.three{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:14px 16px}
.panel-b + .panel-b{border-top:1px solid var(--line-2)}
.panel.tone-teal{border-color:var(--teal)}
.panel.tone-amber{border-color:var(--amber);background:var(--amber-soft)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.ai{background:var(--teal-soft);color:var(--teal)}
.pill.human{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--red-soft);color:var(--red)}
.pill.neutral{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv th,.kv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.kv th{font-weight:500;color:var(--muted);width:46%}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:0}
.kv td.v{color:var(--ink);font-weight:500}
.kv .total th,.kv .total td{border-top:2px solid var(--line);font-weight:600;color:var(--ink);font-size:15px}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}

.conf{display:inline-grid;grid-template-columns:52px auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.conf .bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--teal)}
.conf.low .bar i{background:var(--amber)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;font-weight:500;font-size:13.5px;min-height:40px;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);color:var(--ink);font-size:13.5px;min-height:38px;width:100%}
.field input[type="date"]{color-scheme:inherit}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);padding:6px 0}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}

.note{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:9px;background:var(--panel-2)}
.callout{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px}
.callout.teal{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.callout.amber{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.callout.green{border-color:var(--green);background:var(--green-soft);color:var(--ink)}
.callout.red{border-color:var(--red);background:var(--red-soft);color:var(--ink)}

/* synthetic log card */
.logcard{background:#FFFFFF;color:#1B2433;border:1px solid #C9D1DD;border-radius:6px;font-size:12.5px;font-family:"IBM Plex Sans",Arial,sans-serif;position:relative;overflow:hidden;color-scheme:light}
.logcard .lc-top{background:#F2F4F7;border-bottom:1px solid #C9D1DD;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#4A5563}
.logcard .lc-title{padding:12px 14px 4px;font-size:15px;font-weight:600;color:#1B2433}
.logcard .sec{margin:8px 14px 0;border:1px solid #DCE2EA;border-radius:4px}
.logcard .sec h4{margin:0;background:#EEF1F5;padding:6px 10px;font-size:12px;font-weight:600;color:#2E3A4D}
.logcard .sec table{width:100%;border-collapse:collapse}
.logcard .sec td{padding:5px 10px;border-top:1px solid #EEF1F5;vertical-align:top}
.logcard .sec td:first-child{width:46%;color:#4A5563}
.logcard .sec td:last-child{font-weight:500}
.logcard .lc-foot{padding:10px 14px 12px;font-size:11px;color:#6B7280}
.logcard td.blur{filter:blur(2.2px);position:relative}
.logcard .glare{position:absolute;right:-40px;top:160px;width:220px;height:90px;background:rgba(255,255,255,.75);transform:rotate(-18deg);pointer-events:none}
.logcard.redacted .pii td:last-child{background:repeating-linear-gradient(135deg,#1B2433 0 6px,#2E3A4D 6px 12px);color:transparent;border-radius:3px}
.logcard.redacted .pii td:last-child::after{content:"redacted at ingestion";position:absolute;color:#fff;font-size:10px;margin-left:8px;letter-spacing:.02em}
.logcard .pii td{position:relative}
.shot{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:620px;overflow:auto}

/* phone */
.phone{width:340px;max-width:100%;height:690px;border-radius:30px;background:#111826;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin:0 auto}
.phone .screen{background:var(--chat-bg);border-radius:22px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.phone .ph-h{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.phone .ph-h .av{width:30px;height:30px;border-radius:50%;background:#fff;color:#14355E;display:grid;place-items:center;font-weight:700;font-size:12px}
.phone .ph-h .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.phone .ph-h .st{font-size:11px;opacity:.8}
.chat{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bubble.in{background:var(--bubble-in);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--bubble-out);align-self:flex-end;border-bottom-right-radius:4px}
.bubble .meta{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;text-align:right}
.bubble .who{display:block;font-size:10.5px;color:var(--teal);font-weight:600;margin-bottom:2px}
.bubble .att{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0;font-size:12px}
.bubble .att .ic{width:28px;height:34px;border-radius:4px;background:#fff;border:1px solid #C9D1DD;display:grid;place-items:center;color:#14355E;font-size:9px;font-weight:700}
.bubble .cta{display:inline-flex;margin-top:6px;border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;background:transparent}
.ph-in{display:flex;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
.ph-in .fake{flex:1;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--muted)}

/* quote card inside phone */
.qc{flex:1;overflow:auto;background:var(--panel);padding:14px}
.qc .brandline{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.qc .car{margin-top:10px;font-size:15.5px;font-weight:600;color:var(--ink)}
.qc .plate{display:inline-block;border:1.5px solid var(--ink);border-radius:5px;padding:1px 7px;font-weight:600;letter-spacing:.06em;font-size:12.5px;margin-top:4px}
.qc .total{margin:12px 0 4px;font-size:30px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.qc .verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);font-weight:600}
.qc .brk{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.qc .brk td{padding:5px 0;border-bottom:1px solid var(--line-2)}
.qc .brk td:last-child{text-align:right;font-weight:500;color:var(--ink)}
.qc .brk tr.sub td{color:var(--muted);font-size:12px;padding-left:12px}
.cds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.cd{border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center}
.cd .big{font-size:18px;font-weight:700;color:var(--ink);line-height:1.1}
.cd .lbl{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.cd.hot{border-color:var(--amber);background:var(--amber-soft)}
.qc .stack{display:grid;gap:8px;margin-top:12px}
.qc .btn{justify-content:center;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;background:var(--panel)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:600}
.slots{display:grid;gap:6px}
.slot{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:left;background:var(--panel);font-size:13px}
.slot[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}

/* audit + misc */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:5px}
.timeline li.ai::before{background:var(--teal)}
.timeline li.human::before{background:var(--amber)}
.timeline li.sys::before{background:var(--navy)}
.timeline .ts{color:var(--muted);font-size:11.5px}
.gauge{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--teal)}
.gauge.hot i{background:var(--amber)}
.stat{display:grid;gap:2px}
.stat .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.drops{display:grid;gap:8px}
.drop{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.drop .d{font-weight:600;color:var(--ink)}
.drop.soon{border-color:var(--amber);background:var(--amber-soft)}
.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.rule input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--panel);color:var(--ink);text-align:right;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.inline-list{display:grid;gap:6px;font-size:13px}
.inline-list li{display:flex;gap:8px;align-items:flex-start}
.check{color:var(--green);font-weight:700}
.flag{color:var(--amber);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .stepper{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;gap:6px;padding:10px}
  .step{grid-template-columns:24px auto;white-space:nowrap;padding:8px 10px}
  .step .d{display:none}
  .stepper .foot{display:none}
  .stage{padding:16px 14px 32px}
  .phone{height:640px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">QD</span><span>QuoteDesk <span class="sub">· for Exclusive Global</span></span></div>
    <span class="demo-pill">Prototype demo — synthetic data</span>
    <span class="spacer"></span>
    <label for="scenario">Scenario <select id="scenario">
      <option value="typical">Typical export car (2017–2019)</option>
      <option value="hybrid">Hybrid with VES rebate utilised</option>
      <option value="post2026">Registered after 13 Feb 2026</option>
      <option value="renewed">COE renewed — no PARF</option>
      <option value="random">Random vehicle</option>
    </select></label>
    <button class="btn sm" id="newcar" type="button">New vehicle</button>
  </header>
  <nav class="stepper" aria-label="Demo stages" id="stepper"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<script>
/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const fmt = n => (n < 0 ? "−S$" : "S$") + Math.abs(Math.round(n)).toLocaleString("en-SG");
const fmtK = n => "S$" + (Math.round(n/100)/10).toFixed(1) + "k";
const pad = n => String(n).padStart(2,"0");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addYears = (d, n) => { const x = new Date(d); x.setFullYear(x.getFullYear()+n); return x; };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const round100 = n => Math.round(n/100)*100;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Singapore plate checksum (last two prefix letters + 4 digits, weights 9 4 5 4 3 2, mod 19) */
const CHECK = "AZYXUTSRPMLKJHGEDCB";
function plateCheck(prefix, num){
  const letters = prefix.length >= 2 ? prefix.slice(-2) : "0" + prefix;
  const vals = [];
  for (const ch of letters) vals.push(ch === "0" ? 0 : ch.charCodeAt(0) - 64);
  const digits = String(num).padStart(4, "0").split("").map(Number);
  const all = vals.concat(digits);
  const w = [9,4,5,4,3,2];
  const sum = all.reduce((s, v, i) => s + v * w[i], 0);
  return CHECK[sum % 19];
}
function validatePlate(plate){
  const m = /^([A-Z]{1,3})(\d{1,4})([A-Z])$/.exec(plate.replace(/\s/g,""));
  if (!m) return false;
  return plateCheck(m[1], Number(m[2])) === m[3];
}

function roadTaxAnnual(cc){
  let t;
  if (cc <= 600) t = 400;
  else if (cc <= 1000) t = 400 + 0.25*(cc-600);
  else if (cc <= 1600) t = 500 + 0.75*(cc-1000);
  else if (cc <= 3000) t = 950 + 1.5*(cc-1600);
  else t = 3050 + 2*(cc-3000);
  return Math.round(t * 0.782);
}
/* ARF tiers by registration era (approximate; demo cars sit in the first two bands) */
function expectedARF(omv, regDate){
  const post2023 = regDate >= new Date(2023,1,15);
  const post2022 = regDate >= new Date(2022,1,19);
  let arf = 0, rest = omv;
  const tiers = post2023
    ? [[20000,1.0],[20000,1.4],[20000,1.9],[20000,2.5],[Infinity,3.2]]
    : (post2022 ? [[20000,1.0],[30000,1.4],[30000,1.8],[Infinity,2.2]] : [[20000,1.0],[30000,1.4],[Infinity,1.8]]);
  for (const [band, rate] of tiers){ const slice = Math.min(rest, band); arf += slice*rate; rest -= slice; if (rest <= 0) break; }
  return Math.round(arf);
}
function qpFor(year, cat){ const r = QP[Math.min(2026, Math.max(2013, year))]; const base = cat === "B" ? r[1] : r[0]; return Math.round(base * (0.95 + Math.random()*0.1) / 100) * 100; }
function randomDate(y1, m1, y2, m2){ const a = new Date(y1, m1-1, 1), b = new Date(y2, m2-1, 28); return new Date(a.getTime() + Math.random()*(b-a)); }
function vin(wmi){ const chars = "ABCDEFGHJKLMNPRSTUVWXYZ0123456789"; let s = wmi; while (s.length < 17) s += chars[Math.floor(Math.random()*chars.length)]; return s; }

/* ---------- paper value engine (LTA rules) ---------- */
const PARF_OLD = [75,70,65,60,55,50];
const PARF_NEW = [30,25,20,15,10,5];
const BAND_LABEL = ["Not exceeding 5 years","Above 5 to 6 years","Above 6 to 7 years","Above 7 to 8 years","Above 8 to 9 years","Above 9 to 10 years","Above 10 years"];
function parfRegime(regDate){
  if (regDate >= new Date(2026,1,13)) return {code:"C", label:"Registered from 13 Feb 2026 — revised schedule, S$30,000 cap", pct: PARF_NEW, cap: 30000};
  if (regDate >= new Date(2023,1,15)) return {code:"B", label:"Registered 15 Feb 2023 – 12 Feb 2026 — original schedule, S$60,000 cap", pct: PARF_OLD, cap: 60000};
  return {code:"A", label:"Registered before 15 Feb 2023 — original schedule, no cap", pct: PARF_OLD, cap: Infinity};
}
function ageBand(regDate, deregDate){
  for (let n = 5; n <= 10; n++){ if (deregDate <= addYears(regDate, n)) return n - 5; }
  return 6;
}
function computePaper(v, deregDate, retainPlate){
  const regime = parfRegime(v.regDate);
  const band = ageBand(v.regDate, deregDate);
  const netArf = Math.max(0, v.arfPaid - v.vesRebate);
  let parfPct = 0, parfRebate = 0, parfCapped = false;
  if (v.parfEligible && band <= 5){
    parfPct = regime.pct[band];
    parfRebate = Math.round(netArf * parfPct / 100);
    if (parfRebate > regime.cap){ parfRebate = regime.cap; parfCapped = true; }
  }
  const coeStart = v.renewedOn || v.regDate;
  const totalDays = daysBetween(coeStart, v.coeExpiry);
  const remainDays = Math.max(0, daysBetween(deregDate, v.coeExpiry));
  const coeRebate = Math.round(v.coeQP * remainDays / totalDays);
  const rtRemainMonths = Math.max(0, Math.floor(daysBetween(deregDate, v.roadTaxExpiry) / 30.44));
  const roadTaxRefund = Math.round(v.roadTaxAnnual * rtRemainMonths / 12);
  /* next value drop */
  let nextDrop = null;
  if (v.parfEligible && band <= 5){
    const anniv = addYears(v.regDate, band + 5);
    const nextPct = band + 1 <= 5 ? regime.pct[band + 1] : 0;
    const nextRebate = Math.min(Math.round(netArf * nextPct / 100), regime.cap);
    nextDrop = { lastDay: anniv, dropsOn: addDays(anniv, 1), fromPct: parfPct, toPct: nextPct, amount: parfRebate - nextRebate };
  }
  const retention = retainPlate ? 1300 : 0;
  const paperValue = parfRebate + coeRebate + roadTaxRefund;
  const flags = [];
  if (!v.parfEligible) flags.push("COE was renewed — PARF was forfeited at renewal; paper value is the COE rebate only.");
  if (band === 6) flags.push("Vehicle is over 10 years old at the intended deregistration date — no PARF rebate.");
  if (parfCapped) flags.push(`PARF rebate capped at ${fmt(regime.cap)} under this registration period.`);
  if (v.vesRebate > 0) flags.push(`PARF computed on net ARF (${fmt(v.arfPaid)} − VES rebate ${fmt(v.vesRebate)} = ${fmt(netArf)}).`);
  if (nextDrop && daysBetween(TODAY, nextDrop.dropsOn) <= 45) flags.push(`PARF band drops on ${fmtDate(nextDrop.dropsOn)} — deregister on or before ${fmtDate(nextDrop.lastDay)} to keep ${nextDrop.fromPct}%.`);
  if (daysBetween(TODAY, v.roadTaxExpiry) < 30) flags.push("Road tax expires within 30 days — must be valid up to deregistration.");
  if (daysBetween(TODAY, v.coeExpiry) < 120) flags.push("COE expires within 4 months — likely scrap/export candidate; encourage an early handover.");
  return { regime, band, bandLabel: BAND_LABEL[band], netArf, parfPct, parfRebate, parfCapped, coeRebate, remainDays, totalDays, rtRemainMonths, roadTaxRefund, retention, paperValue, nextDrop, flags };
}

/* ---------- body value recommender ---------- */
function generateComps(v){
  const comps = [];
  const n = randInt(5, 7);
  for (let i = 0; i < n; i++){
    const date = addDays(TODAY, -randInt(15, 700));
    const yom = v.yom + randInt(-1, 1);
    const mileage = randInt(60000, 150000);
    const base = v.bodyRange[0] + Math.random()*(v.bodyRange[1]-v.bodyRange[0]);
    const bodyPaid = round100(base - (mileage - 105000)/10000 * 150 + (yom - v.yom) * 300);
    const dest = pick(v.demand);
    const soldFor = round100(bodyPaid * (1.26 + Math.random()*0.16));
    comps.push({ date, yom, mileage, bodyPaid, dest, soldFor, days: randInt(18, 46), colour: pick(COLOURS) });
  }
  comps.sort((a,b) => b.date - a.date);
  const auctions = [
    { platform: "Quotz (Sgcarmart) auction", date: addDays(TODAY, -randInt(5, 40)), mileage: randInt(80000, 140000), yom: v.yom, bid: round100((v.bodyRange[0]+v.bodyRange[1])/2 * (0.94 + Math.random()*0.14)) },
    { platform: "Carousell Autos dealer auction", date: addDays(TODAY, -randInt(5, 60)), mileage: randInt(80000, 140000), yom: v.yom + randInt(-1, 0), bid: round100((v.bodyRange[0]+v.bodyRange[1])/2 * (0.92 + Math.random()*0.14)) }
  ];
  return { comps, auctions };
}
const median = arr => { const s = [...arr].sort((a,b)=>a-b); const m = Math.floor(s.length/2); return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
function recommendBody(v, data, rules){
  const { comps, auctions } = data;
  const base = round100(median(comps.map(c => c.bodyPaid)));
  const medMiles = median(comps.map(c => c.mileage));
  const adjustments = [];
  const mileageAdj = -Math.round((v.mileage - medMiles)/10000) * rules.perTenK;
  if (mileageAdj !== 0) adjustments.push({ label: `Mileage ${v.mileage.toLocaleString()} km vs comparables’ ${Math.round(medMiles).toLocaleString()} km (${fmt(rules.perTenK)} per 10,000 km)`, amount: mileageAdj });
  const avgAuction = Math.round(auctions.reduce((s,a)=>s+a.bid,0)/auctions.length);
  const delta = avgAuction - base;
  if (Math.abs(delta) > 0.05*base){ const adj = round100(Math.max(-600, Math.min(600, delta*0.5))); adjustments.push({ label: `Recent auction bids average ${fmt(avgAuction)} (${delta>0?"above":"below"} comparables by >5%) — half the gap applied`, amount: adj }); }
  else adjustments.push({ label: `Recent auction bids average ${fmt(avgAuction)} — within 5% of comparables, no adjustment`, amount: 0 });
  if (WANT_LIST.includes(v.model)) adjustments.push({ label: `On the New Zealand buyers’ want list this month (+${rules.demandPct}% demand uplift)`, amount: round100(base * rules.demandPct/100) });
  const condAdj = { Good: 0, Fair: -rules.fairDeduct, Poor: -rules.poorDeduct }[v.condition] || 0;
  if (condAdj !== 0) adjustments.push({ label: `Owner-declared condition: ${v.condition}`, amount: condAdj });
  const mid = round100(base + adjustments.reduce((s,a)=>s+a.amount,0));
  const low = round100(mid * (1 - rules.spread/100)), high = round100(mid * (1 + rules.spread/100));
  const recent = comps.filter(c => daysBetween(c.date, TODAY) <= 183).length;
  const confidence = comps.length >= 5 && recent >= 2 ? "High" : "Medium";
  const expectedSale = Math.round(comps.reduce((s,c)=>s+c.soldFor,0)/comps.length);
  return { base, medMiles, adjustments, mid, low, high, confidence, recent, avgAuction, expectedSale };
}

    { pts: 15, why: "Log card attached in the first message" },

    { pts: coeMonths <= 6 ? 20 : (coeMonths <= 12 ? 10 : 0), why: coeMonths <= 12 ? `COE expires in ${coeMonths} months — must decide soon` : "COE expiry more than a year away" },
    { pts: v.seenBefore ? 10 : 0, why: v.seenBefore ? `Enquired before on ${fmtDate(v.seenBefore.when)} — returning owner` : "First enquiry from this number" }
  ];
  if (S.intentLog.length === 0) signals.forEach(s => { if (s.pts) addIntent(s.pts, s.why); });
  const chat = `<div class="chat">
    <div class="bubble in">Hi, I want to export my car. Here is my log card.<span class="att"><span class="ic">PDF</span><span>Vehicle Registration Details — ${v.plate}.pdf<br><span class="muted">2 pages · 410 KB</span></span></span>How much can you offer?<span class="meta">${nowTime()}</span></div>
    <div class="bubble out"><span class="who">Exclusive Global · AI assistant</span>Thanks! Received the log card for <b>${v.plate}</b>. I’m reading it now — your quote will be ready in a few minutes.<br><br>One quick question: roughly how many km has the car done?<span class="meta">${nowTime()}</span></div>
    <div class="bubble in">About ${v.mileage.toLocaleString()} km. Any accident? No.<span class="meta">${nowTime()}</span></div>
    <div class="bubble out"><span class="who">Exclusive Global · AI assistant</span>Got it. Two things to know while you wait:<br>1. Your quote shows the <b>LTA paper value</b> (PARF + COE rebate) separately from our <b>body offer</b>, so you can verify it.<br>2. You can keep your number plate — we handle the retention.<br><br>Reply <b>agent</b> any time to chat with our team.<span class="meta">${nowTime()}</span></div>
    ${S.accessCode ? `<div class="bubble in"><span class="who" style="color:var(--muted)">SMS from LTA (to Exclusive Global’s number)</span>Access Code <b>${S.accessCode}</b> for vehicle ${v.plate}. Valid till ${fmtDate(addDays(TODAY,14))}. Use it to enquire PARF/COE rebate on OneMotoring.<span class="meta">${nowTime()}</span></div>` : ""}
  </div>`;
  const intentPct = S.intent;
  return `<div class="stage-head"><div class="lead"><h1>1 · WhatsApp intake</h1><p>The owner messages the same Exclusive Global number as today. The AI answers routine questions from pre-approved content, asks for what’s missing, and queues the enquiry. Staff keep replying by hand from the WhatsApp Business app whenever they want (Coexistence).</p></div><div class="actions"><span class="pill ai"><span class="dot"></span>Automated</span></div></div>
  <div class="grid phone-side">
    <div>${phone("online · AI assistant on duty", chat)}</div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Triage</h2><span class="pill ai">Classified in 1.2 s</span></div><div class="panel-b">
        <table class="kv"><tr><th>Intent</th><td class="v">New purchase enquiry · export <span class="muted small">(0.96)</span></td></tr><tr><th>Language</th><td class="v">English</td></tr><tr><th>Attachment</th><td class="v">1 PDF · looks like a OneMotoring printout <span class="muted small">(0.98)</span></td></tr><tr><th>Needs a human?</th><td class="v">No — routine; queued for Quote Desk</td></tr><tr><th>Routing</th><td class="v">Quote Desk queue · assigned to Ops (${S.assignee}) · SLA 5 min</td></tr>${v.seenBefore ? `<tr><th>History</th><td class="v">Same chassis enquired ${fmtDate(v.seenBefore.when)} — previous thread linked</td></tr>` : ""}</table>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Buyer-intent score</h2><span class="pill ${intentPct >= 40 ? "human" : "neutral"}">${intentPct >= 40 ? "Warm" : "Cold"} · ${intentPct}/100</span></div><div class="panel-b">
        <div class="gauge ${intentPct >= 40 ? "hot" : ""}"><i style="width:${intentPct}%"></i></div>
        <ul class="inline-list" style="margin:10px 0 0;padding:0;list-style:none">${S.intentLog.map(s => `<li><span class="tnum strong">+${s.points}</span><span>${esc(s.why)}</span></li>`).join("")}</ul>
        <p class="small muted" style="margin-top:8px">Scores rank the queue; they never block a reply. Later signals (card opens, taps, reply speed) keep updating it.</p>
      </div></div>
      <div class="panel tone-teal"><div class="panel-h"><h2>Alternative intake: LTA Access Code</h2><span class="pill ai">No OCR at all</span></div><div class="panel-b">
        <p class="small">Since 30 June 2025 a dealer needs an owner-issued Access Code to pull the PARF/COE rebate from OneMotoring. The AI can ask the owner to nominate Exclusive Global’s number; LTA then texts the 6-digit code straight to EG and the paper value comes from LTA itself. Validity (14 days by default) matches the quote window.</p>
        <div class="actions" style="margin-top:10px">${S.accessCode ? `<span class="pill ok">Code ${S.accessCode} received · paper value will be marked “verified with LTA”</span>` : `<button class="btn sm accent" type="button" id="simcode">Simulate: owner issues an Access Code</button>`}</div>
      </div></div>
    </div>
  </div>
  ${footerNav(null, "extract", "Continue to extraction")}`;
}

/* ---------- stage 2: extraction ---------- */
function renderExtract(){
  const v = S.vehicle;
  const expected = expectedARF(v.omv, v.regDate);
  const fields = [
    ["Vehicle No.", v.plate, 0.99], ["Make / Model", `${v.make} ${v.model}`, 0.98], ["Propellant", v.propellant, 0.99], ["Chassis No.", v.chassis, 0.96], ["Engine No.", v.engineNo, 0.88],
    ["Original registration date", fmtDate(v.regDate), 0.99], v.renewedOn ? ["COE renewed on", fmtDate(v.renewedOn), 0.97] : null, ["No. of transfers", String(v.transfers), 0.99], ["Year of manufacture", String(v.yom), 0.99], ["Engine capacity", `${v.cc} cc`, 0.99],
    ["Open Market Value", fmt(v.omv), 0.98], ["Actual ARF paid", fmt(v.arfPaid), 0.74], ["VES rebate utilised", fmt(v.vesRebate), 0.97], ["COE category", v.coeCategory, 0.99], ["Actual QP paid", fmt(v.coeQP), 0.97], ["COE expiry", fmtDate(v.coeExpiry), 0.99],
    ["PARF eligibility", v.parfEligible ? "Yes" : "No", 0.99], ["PARF eligibility expiry", v.parfEligible ? fmtDate(v.parfExpiry) : "—", 0.98], ["Road tax expiry", fmtDate(v.roadTaxExpiry), 0.98],
    ["Owner name", v.owner.name.split(" ").map(w => w[0] + "•".repeat(Math.max(1, w.length-1))).join(" "), 0.97], ["Owner ID", v.owner.nric[0] + "••••" + v.owner.nric.slice(-3), 0.97], ["Registered address", "redacted — not stored", 0.97], ["Mileage (from chat)", `${v.mileage.toLocaleString()} km`, 0.95]
  ].filter(Boolean);
  const checks = `<ul class="inline-list" style="margin:0;padding:0;list-style:none">
    <li><span class="check">✓</span><span>Plate checksum valid — <span class="tnum">${v.plate}</span> passes the LTA check-letter algorithm</span></li>
    <li><span class="check">✓</span><span>COE expiry = ${v.renewedOn ? "renewal" : "registration"} date + 10 years</span></li>
    <li><span class="flag">!</span><span>ARF paid read at low confidence (0.74, glare on the scan) — cross-check: OMV ${fmt(v.omv)} on the ${parfRegime(v.regDate).code === "A" ? "pre-2023" : "revised"} ARF tiers gives ${fmt(expected)} → ${expected === v.arfPaid ? "matches the read value; accepted" : "differs; sent for a 10-second human check"}</span></li>
    <li><span class="check">✓</span><span>PARF eligibility ${v.parfEligible ? "Yes — consistent with no COE renewal on record" : "No — consistent with COE renewal on " + fmtDate(v.renewedOn)}</span></li>
    <li><span class="${v.seenBefore ? "flag" : "check"}">${v.seenBefore ? "!" : "✓"}</span><span>${v.seenBefore ? "Chassis seen before (" + fmtDate(v.seenBefore.when) + ") — merged with the earlier enquiry" : "No earlier enquiry for this chassis"}</span></li>
    <li><span class="check">✓</span><span>Owner block (name, NRIC, address, birth date) masked before storage; the raw upload is purged after 30 days</span></li>
  </ul>`;
  const right = S.extracted ? `
    <div class="panel"><div class="panel-h"><h2>Extracted fields</h2><span class="pill ai">${fields.length} fields · 2.8 s</span></div><div class="panel-b" style="padding:0 8px"><table class="kv">${fields.map(f => `<tr><th>${f[0]}</th><td class="v">${esc(f[1])}<br>${conf(f[2])}</td></tr>`).join("")}</table></div></div>
    <div class="panel"><div class="panel-h"><h2>Checks before anything is priced</h2><span class="pill ok">5 of 6 passed · 1 resolved by cross-check</span></div><div class="panel-b">${checks}</div></div>`
    : `<div class="panel"><div class="panel-h"><h2>Extracted fields</h2><span class="pill neutral">Waiting</span></div><div class="panel-b">
        <p>The vision model reads the whole printout in one pass and returns every field with a confidence score. Anything under 0.85 is flagged; where a rule can confirm it (ARF from OMV tiers, COE expiry from the registration date, plate check-letter) the system resolves it without a human.</p>
        <div class="actions" style="margin-top:12px"><button class="btn accent" type="button" id="runx" ${S.extracting ? "disabled" : ""}>${S.extracting ? "Reading the document…" : "Run extraction"}</button><span class="small muted">In production this call costs about S$0.02 per document.</span></div>
      </div></div>`;
  return `<div class="stage-head"><div class="lead"><h1>2 · AI reads and verifies the log card</h1><p>Left: the owner’s upload (a synthetic OneMotoring-style printout with a glare patch, as real phone scans have). Right: what the system extracts, how sure it is, and the checks that replace manual re-typing.</p></div><div class="actions"><label class="toggle"><input type="checkbox" id="redact" ${S.redacted ? "checked" : ""}> Mask owner identity in the stored copy (PDPA)</label></div></div>
  <div class="grid two"><div class="shot">${logcardHTML(v, true)}</div><div class="grid" style="align-content:start">${right}</div></div>
  ${footerNav("intake", "paper", "Continue to paper value", S.extracted)}`;
}

/* ---------- stage 3: paper value ---------- */
function renderPaper(){
  const v = S.vehicle; const p = paper();
  const field = (label, id, type, value, extra="") => `<label class="field"><span>${label}</span><input type="${type}" id="${id}" value="${value}" ${extra}></label>`;
  const drops = [];
  if (p.nextDrop && p.band <= 5) drops.push({ d: p.nextDrop.dropsOn, t: `PARF band drops from ${p.nextDrop.fromPct}% to ${p.nextDrop.toPct}% — rebate falls by <b>${fmt(p.nextDrop.amount)}</b>. Last safe deregistration day: ${fmtDate(p.nextDrop.lastDay)}.`, soon: daysBetween(TODAY, p.nextDrop.dropsOn) <= 45 });
  drops.push({ d: v.roadTaxExpiry, t: "Road tax expires — must be valid up to deregistration; unused months are refunded.", soon: daysBetween(TODAY, v.roadTaxExpiry) <= 30 });
  drops.push({ d: v.coeExpiry, t: `COE expires — rebate shrinks by about ${fmt(v.coeQP/p.totalDays*30)} every month until then.`, soon: daysBetween(TODAY, v.coeExpiry) <= 120 });
  drops.sort((a,b) => a.d - b.d);
  return `<div class="stage-head"><div class="lead"><h1>3 · Paper value — computed, not guessed</h1><p>Everything on this screen follows LTA’s published rules, so it is the same for every ops member and every day. Fields are editable here to show the engine reacting; in production they are locked to the verified extraction${S.accessCode ? " or the LTA Access Code lookup" : ""}.</p></div><div class="actions"><span class="pill ${S.accessCode ? "ok" : "ai"}">${S.accessCode ? "Source: LTA Access Code lookup" : "Source: verified extraction"}</span></div></div>
  <div class="grid two">
    <div class="panel"><div class="panel-h"><h2>Inputs</h2><span class="pill neutral">${p.regime.code === "A" ? "Pre-2023 registration" : p.regime.code === "B" ? "2023–2026 registration" : "Post-13 Feb 2026 registration"}</span></div><div class="panel-b">
      <div class="fields">
        ${field("Original registration date", "f-reg", "date", isoDate(v.regDate))}
        ${field("Intended deregistration date", "f-dereg", "date", isoDate(S.deregDate))}
        ${field("Actual ARF paid (S$)", "f-arf", "number", v.arfPaid, 'step="100"')}
        ${field("VES / CEVS rebate utilised (S$)", "f-ves", "number", v.vesRebate, 'step="500"')}
        ${field("COE quota premium paid (S$)", "f-qp", "number", v.coeQP, 'step="100"')}
        ${field("COE expiry", "f-coe", "date", isoDate(v.coeExpiry))}
        ${field("Road tax expiry", "f-rt", "date", isoDate(v.roadTaxExpiry))}
        ${field("Annual road tax (S$, estimated from ${v.cc} cc)", "f-rta", "number", v.roadTaxAnnual, 'step="1"')}
      </div>
      <div style="margin-top:10px"><label class="toggle"><input type="checkbox" id="f-parf" ${v.parfEligible ? "checked" : ""}> PARF-eligible (COE never renewed)</label><label class="toggle"><input type="checkbox" id="f-plate" ${S.retainPlate ? "checked" : ""}> Owner keeps the number plate (LTA retention fee S$1,300, handled by EG)</label></div>
    </div></div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Paper value at ${fmtDate(S.deregDate)}</h2><span class="pill ok">Deterministic</span></div><div class="panel-b" style="padding:4px 8px">
        <table class="kv">
          <tr><th>Rebate schedule</th><td class="v">${p.regime.label}</td></tr>
          <tr><th>Age at deregistration</th><td class="v">${p.bandLabel}</td></tr>
          <tr><th>PARF rebate</th><td class="v">${p.parfPct}% × net ARF ${fmt(p.netArf)} = <b>${fmt(p.parfRebate)}</b>${p.parfCapped ? " (capped)" : ""}</td></tr>
          <tr><th>COE rebate</th><td class="v">${fmt(v.coeQP)} × ${p.remainDays} / ${p.totalDays} days = <b>${fmt(p.coeRebate)}</b></td></tr>
          <tr><th>Road tax refund</th><td class="v">${p.rtRemainMonths} unused months ≈ <b>${fmt(p.roadTaxRefund)}</b></td></tr>
          <tr class="total"><th>Paper value</th><td class="v tnum">${fmt(p.paperValue)}</td></tr>
          ${S.retainPlate ? `<tr><th>Plate retention (deducted from offer)</th><td class="v">−${fmt(1300)}</td></tr>` : ""}
        </table>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Value-drop calendar</h2><span class="pill human">Shown to ops and, later, to the owner</span></div><div class="panel-b">
        <div class="drops">${drops.map(d => `<div class="drop ${d.soon ? "soon" : ""}"><span class="d tnum">${fmtDate(d.d)}</span><span>${d.t}</span><span class="small muted tnum">${daysBetween(TODAY, d.d)} d</span></div>`).join("")}</div>
        ${p.flags.length ? `<div class="callout amber" style="margin-top:10px"><b>Flags for the ops member</b><ul style="margin:6px 0 0;padding-left:18px">${p.flags.map(f => `<li>${f}</li>`).join("")}</ul></div>` : ""}
      </div></div>
    </div>
  </div>
  ${footerNav("extract", "body", "Continue to body value")}`;
}

/* ---------- stage 4: body value ---------- */

  const v = S.vehicle; const r = ensureComps(); const { comps, auctions } = S.compsData;
  const rule = (label, id, val) => `<div class="rule"><span>${label}</span><input type="number" id="${id}" value="${val}" step="1"></div>`;
  return `<div class="stage-head"><div class="lead"><h1>4 · Body value — a recommendation with its reasons</h1><p>The body is what Exclusive Global can sell the car for overseas, less costs and margin. The engine starts from EG’s own purchase history, checks it against recent auction bids, applies the configurable rules below and explains every adjustment. Ops can change the rules; the engine never issues a price on its own.</p></div><div class="actions"><span class="pill ai"><span class="dot"></span>AI-assisted</span></div></div>
  <div class="grid two">
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Comparable purchases — ${v.make} ${v.model}</h2><span class="pill neutral">From EG’s deal record (synthetic)</span></div><div class="panel-b table-wrap" style="padding:0 8px">
        <table class="tbl"><thead><tr><th>Bought</th><th>YOM</th><th class="r">Mileage</th><th class="r">Body paid</th><th>Sold to</th><th class="r">Sold for</th><th class="r">Days held</th></tr></thead><tbody>${comps.map(c => `<tr><td>${fmtDate(c.date)}</td><td>${c.yom}</td><td class="r tnum">${c.mileage.toLocaleString()}</td><td class="r tnum">${fmt(c.bodyPaid)}</td><td>${c.dest}</td><td class="r tnum">${fmt(c.soldFor)}</td><td class="r tnum">${c.days}</td></tr>`).join("")}</tbody></table>
      </div></div>

        <table class="tbl"><thead><tr><th>Platform</th><th>Date</th><th>YOM</th><th class="r">Mileage</th><th class="r">Winning body bid</th></tr></thead><tbody>${auctions.map(a => `<tr><td>${a.platform}</td><td>${fmtDate(a.date)}</td><td>${a.yom}</td><td class="r tnum">${a.mileage.toLocaleString()}</td><td class="r tnum">${fmt(a.bid)}</td></tr>`).join("")}</tbody></table>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Pricing rules</h2><span class="pill human">Configurable by the manager</span></div><div class="panel-b">
        <div class="rules">${rule("Mileage adjustment per 10,000 km above or below comparables (S$)", "r-miles", S.rules.perTenK)}${rule("Demand uplift when a model is on the overseas want list (%)", "r-demand", S.rules.demandPct)}${rule("Range spread around the midpoint (±%)", "r-spread", S.rules.spread)}${rule("Deduction for owner-declared “Fair” condition (S$)", "r-fair", S.rules.fairDeduct)}${rule("Deduction for owner-declared “Poor” condition (S$)", "r-poor", S.rules.poorDeduct)}</div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="small muted">Owner-declared condition</span><span class="seg" role="group" aria-label="Condition">${["Good","Fair","Poor"].map(c => `<button type="button" data-cond="${c}" aria-pressed="${v.condition === c}">${c}</button>`).join("")}</span></div>
      </div></div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel tone-teal"><div class="panel-h"><h2>Recommended body offer</h2><span class="pill ${r.confidence === "High" ? "ok" : "human"}">${r.confidence} confidence · ${comps.length} comparables, ${r.recent} in the last 6 months</span></div><div class="panel-b">
        <div class="stats"><div class="stat"><span class="v tnum">${fmt(r.low)} – ${fmt(r.high)}</span><span class="l">Recommended range</span></div><div class="stat"><span class="v tnum">${fmt(r.mid)}</span><span class="l">Midpoint</span></div></div>
        <table class="kv" style="margin-top:12px"><tr><th>Median of comparables</th><td class="v tnum">${fmt(r.base)}</td></tr>${r.adjustments.map(a => `<tr><th>${a.label}</th><td class="v tnum">${a.amount === 0 ? "—" : (a.amount > 0 ? "+" : "") + fmt(a.amount).replace("−S$","−S$")}</td></tr>`).join("")}<tr class="total"><th>Midpoint</th><td class="v tnum">${fmt(r.mid)}</td></tr></table>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Internal view — expected export economics</h2><span class="pill neutral">Never shown to the owner</span></div><div class="panel-b">
        <table class="kv"><tr><th>Average overseas sale price (comparables)</th><td class="v tnum">${fmt(r.expectedSale)}</td></tr><tr><th>Gross body margin at midpoint</th><td class="v tnum">${fmt(r.expectedSale - r.mid)} (${Math.round((r.expectedSale - r.mid)/r.mid*100)}%)</td></tr><tr><th>Destinations buying this model</th><td class="v">${v.demand.join(", ")}${WANT_LIST.includes(v.model) ? " · on this month’s want list" : ""}</td></tr></table>
        <p class="small muted" style="margin-top:8px">Every override the ops member makes is logged with a reason and feeds the alignment metric (target 70–90% within tolerance).</p>
      </div></div>
    </div>
  </div>
  ${footerNav("paper", "desk", "Send to Quote Desk")}`;
}

/* ---------- stage 5: quote desk ---------- */
function renderDesk(){
  const v = S.vehicle; const r = ensureComps(); if (S.bodyOffer === null) S.bodyOffer = r.mid;
  const t = total(); const p = t.p;
  const dev = (S.bodyOffer - r.mid) / r.mid;
  const needs = Math.abs(dev) > 0.05 || t.total > 40000;
  S.approval.needed = needs;
  const align = Math.max(0, 100 - Math.round(Math.abs(dev)*100*2));
  const quoteText = `Hi, here is Exclusive Global’s offer for ${v.plate} (${vehicleTitle(v)}): ${fmt(t.total)} in total — LTA paper value ${fmt(p.paperValue)} (PARF ${fmt(p.parfRebate)} + COE rebate ${fmt(p.coeRebate)} + road tax refund ${fmt(p.roadTaxRefund)}) plus our body offer ${fmt(S.bodyOffer)}${S.retainPlate ? ", less S$1,300 plate retention" : ""}. Valid 14 days. Tap to view the full breakdown and lock it in: eg.sg/q/${v.plate.slice(0,3).toLowerCase()}${randInt(100,999)}`;
  const canIssue = !needs || S.approval.approved;
  const approvalPanel = !needs ? `<div class="callout green"><b>Within policy</b> — body offer is within ±5% of the recommendation and the total is under S$40,000. The ops member can issue this quote directly.</div>`
    : S.approval.approved ? `<div class="callout green"><b>Approved by the manager</b> at ${S.approval.at} — one tap in WhatsApp, logged below.</div>`
    : S.approval.requested ? `<div class="callout amber"><b>Waiting for the manager</b> — sent to WhatsApp at ${S.approval.at}.</div>
        <div class="phone" style="height:auto;margin-top:12px;width:300px;padding:8px"><div class="screen" style="height:auto"><div class="ph-h"><span class="av">QD</span><div><div class="nm">Quote Desk · approvals</div><div class="st">to: Manager</div></div></div><div class="chat" style="flex:none"><div class="bubble in" style="max-width:100%"><span class="who">Quote Desk</span><b>Approval needed · ${v.plate}</b><br>${vehicleTitle(v)}, ${v.mileage.toLocaleString()} km<br>Paper ${fmt(p.paperValue)} + body ${fmt(S.bodyOffer)} = <b>${fmt(t.total)}</b><br>Recommended body ${fmt(r.mid)} (${dev > 0 ? "+" : ""}${Math.round(dev*100)}%)<br>Reason: ${esc(S.overrideReason || "—")}<br><div class="actions" style="margin-top:8px"><button class="btn sm accent" type="button" id="mgr-approve">Approve</button><button class="btn sm" type="button" id="mgr-reject">Send back</button></div></div></div></div></div>`
    : `<div class="callout amber"><b>Manager approval required</b> — ${Math.abs(dev) > 0.05 ? `body offer is ${Math.round(Math.abs(dev)*100)}% ${dev > 0 ? "above" : "below"} the recommendation` : ""}${Math.abs(dev) > 0.05 && t.total > 40000 ? " and " : ""}${t.total > 40000 ? "total exceeds S$40,000" : ""}. ${S.overrideReason.trim() ? "" : "Add a reason first."}</div>
        <div class="actions" style="margin-top:10px"><button class="btn amber" type="button" id="req-approval" ${S.overrideReason.trim() ? "" : "disabled"}>Send to manager on WhatsApp</button></div>`;
  return `<div class="stage-head"><div class="lead"><h1>5 · QuoteDesk review — one screen, one decision</h1><p>The ops member sees the verified paper value, the recommended body offer and the reasons, adjusts if needed, and issues. Anything outside policy goes to the manager as a WhatsApp message with an Approve button — no new app for them to learn. Every step lands in the audit trail.</p></div><div class="actions"><span class="pill human"><span class="dot"></span>Human decision</span></div></div>
  <div class="grid two">
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Compose the offer — ${v.plate}</h2><span class="pill neutral">${vehicleTitle(v)} · ${v.mileage.toLocaleString()} km</span></div><div class="panel-b">
        <table class="kv"><tr><th>LTA paper value (verified)</th><td class="v tnum">${fmt(p.paperValue)}</td></tr><tr><th>Recommended body offer</th><td class="v tnum">${fmt(r.low)} – ${fmt(r.high)} · mid ${fmt(r.mid)}</td></tr></table>
        <div class="fields" style="margin-top:12px"><label class="field"><span>Body offer (S$)</span><input type="number" id="q-body" value="${S.bodyOffer}" step="100"></label><label class="field"><span>Reason for change (required if outside the range)</span><input type="text" id="q-reason" value="${esc(S.overrideReason)}" placeholder="e.g. rear bumper repaint needed"></label></div>
        <label class="toggle" style="margin-top:8px"><input type="checkbox" id="q-plate" ${S.retainPlate ? "checked" : ""}> Owner keeps the plate (−S$1,300)</label>
        <table class="kv" style="margin-top:8px"><tr class="total"><th>Total offer to owner</th><td class="v tnum">${fmt(t.total)}</td></tr></table>
        <div style="margin-top:12px">${approvalPanel}</div>
        <div class="actions" style="margin-top:14px"><button class="btn primary" type="button" id="issue" ${canIssue ? "" : "disabled"}>${S.issued ? "Quote issued — view the owner’s card" : "Issue quote to owner"}</button><span class="small muted">Alignment with AI recommendation: <b class="tnum">${align}%</b></span></div>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Message preview (WhatsApp)</h2><span class="pill neutral">Utility template</span></div><div class="panel-b"><div class="bubble out" style="max-width:100%"><span class="who">Exclusive Global</span>${esc(quoteText)}</div></div></div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Audit trail</h2><span class="pill neutral">Who, what, when — immutable</span></div><div class="panel-b"><ol class="timeline">${S.audit.map(a => `<li class="${a.kind}"><span><span class="ts tnum">${a.ts}</span> · ${esc(a.text)}</span></li>`).join("")}</ol></div></div>
      <div class="panel"><div class="panel-h"><h2>Approval policy</h2><span class="pill human">Set by the manager</span></div><div class="panel-b"><table class="kv"><tr><th>Ops may issue directly</th><td class="v">Body within ±5% of recommendation and total ≤ S$40,000</td></tr><tr><th>Manager approval</th><td class="v">Anything else — approve or send back from WhatsApp</td></tr><tr><th>Validity</th><td class="v">14 days, then auto-closed; revival goes back to this desk</td></tr><tr><th>Roles</th><td class="v">Ops: compose, issue within policy · Manager: approve, edit rules · Admin: users, audit export</td></tr></table></div></div>
    </div>
  </div>
  ${footerNav("body", "card", "View the owner’s Live Quote Card", !!S.issued)}`;
}

/* ---------- stage 6: live quote card ---------- */
function cdParts(ms){ if (ms <= 0) return "0d 0h"; const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000); return d > 0 ? `${d}d ${pad(h)}h` : `${pad(h)}:${pad(m)}:${pad(s)}`; }
function renderCard(){
  const v = S.vehicle; const t = total(); const p = t.p; const issued = S.issued || new Date();
  const expiry = addDays(issued, 14);
  const cdTiles = `<div class="cds">
    <div class="cd" data-cd="${expiry.getTime()}"><div class="big tnum">${cdParts(expiry - Date.now())}</div><div class="lbl">offer valid</div></div>
    ${p.nextDrop ? `<div class="cd ${daysBetween(TODAY, p.nextDrop.dropsOn) <= 45 ? "hot" : ""}"><div class="big tnum">${daysBetween(TODAY, p.nextDrop.dropsOn)}d</div><div class="lbl">until your PARF rebate drops by ${fmtK(p.nextDrop.amount)}</div></div>` : `<div class="cd"><div class="big tnum">—</div><div class="lbl">no PARF band drop ahead</div></div>`}
    <div class="cd"><div class="big tnum">${daysBetween(TODAY, v.coeExpiry)}d</div><div class="lbl">until COE expires</div></div>
  </div>`;
  let inner;
  if (S.ownerView === "card") inner = `<div class="qc">
      <div class="brandline"><span class="av" style="width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700">EG</span>Your offer from Exclusive Global</div>
      <div class="car">${vehicleTitle(v)}</div><span class="plate">${v.plate}</span>
      <div class="total tnum">${fmt(t.total)}</div>
      <span class="verified"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>Paper value ${S.accessCode ? "verified with LTA" : "computed from your log card"} on ${fmtDate(TODAY)}</span>
      <table class="brk"><tr><td>LTA paper value</td><td class="tnum">${fmt(p.paperValue)}</td></tr><tr class="sub"><td>PARF rebate (${p.parfPct}% of net ARF)</td><td class="tnum">${fmt(p.parfRebate)}</td></tr><tr class="sub"><td>COE rebate (${p.remainDays} days left)</td><td class="tnum">${fmt(p.coeRebate)}</td></tr><tr class="sub"><td>Road tax refund</td><td class="tnum">${fmt(p.roadTaxRefund)}</td></tr><tr><td>Exclusive Global body offer</td><td class="tnum">${fmt(S.bodyOffer)}</td></tr>${S.retainPlate ? `<tr><td>Keep your plate (LTA fee)</td><td class="tnum">−${fmt(1300)}</td></tr>` : ""}</table>
      ${cdTiles}
      <div class="stack"><button class="btn accent" type="button" data-owner="accept">Accept and pick a handover slot</button><button class="btn" type="button" data-owner="higher">I have a higher offer</button><button class="btn ghost" type="button" data-owner="notnow">Not now</button></div>
      <p class="small muted" style="margin-top:12px">Questions? Reply on WhatsApp — a person will answer. Offer valid until ${fmtDate(expiry)}.</p>
    </div>`;
  else if (S.ownerView === "accept") inner = `<div class="qc"><div class="car">Pick a handover slot</div><p class="small muted">Our driver collects the car and documents; payment follows LTA’s transfer confirmation.</p>
      <div class="slots" style="margin-top:12px">${[1,2,3].map(i => { const d = addDays(TODAY, i*2); const lbl = `${fmtDate(d)} · ${["10:00","14:00","16:30"][i-1]}`; return `<button class="slot" type="button" data-slot="${esc(lbl)}" aria-pressed="${S.slot === lbl}">${lbl}</button>`; }).join("")}</div>
      <div class="stack"><button class="btn accent" type="button" data-owner="confirm" ${S.slot ? "" : "disabled"}>Confirm handover</button><button class="btn ghost" type="button" data-owner="card">Back</button></div></div>`;
  else if (S.ownerView === "confirmed") inner = `<div class="qc"><div class="callout green"><b>Handover booked</b> — ${esc(S.slot)}.<br>We’ll send a reminder the day before, with the document checklist (NRIC, log card access, bank details). Your price is locked.</div><div class="stack"><button class="btn ghost" type="button" data-owner="card">View offer</button></div></div>`;
  else if (S.ownerView === "higher") inner = `<div class="qc"><div class="car">Got a better offer?</div><p class="small muted">Send a screenshot or type the amount. We read it the same way we read your log card and come back within the hour.</p>
      ${S.counter ? `<div class="callout teal" style="margin-top:12px"><b>Offer received: ${fmt(S.counter)}</b> from another dealer. Sent to our team for review — you’ll hear back by ${nowTime().replace(/:\d\d$/, ":00")} +1h.</div>` : `<div class="stack"><button class="btn accent" type="button" data-owner="sendshot">Send screenshot (simulated)</button></div>`}
      <div class="stack"><button class="btn ghost" type="button" data-owner="card">Back to offer</button></div></div>`;
  else if (S.ownerView === "notnow") inner = `<div class="qc"><div class="car">No problem — may we ask why?</div><div class="chips" style="margin-top:12px">${["Waiting for other quotes","Thinking of renewing COE","Price lower than expected","Not selling yet"].map(c => `<button class="chip" type="button" data-reason="${esc(c)}" aria-pressed="${S.notNowReason === c}">${c}</button>`).join("")}</div>
      ${S.notNowReason ? `<div class="callout green" style="margin-top:12px">Thanks. We’ll keep your offer open until ${fmtDate(expiry)}${p.nextDrop && daysBetween(TODAY, p.nextDrop.dropsOn) <= 60 ? ` and remind you before your rebate drops on ${fmtDate(p.nextDrop.dropsOn)}` : ""}.</div>` : ""}
      <div class="stack"><button class="btn ghost" type="button" data-owner="card">Back to offer</button></div></div>`;
  const schedule = [
    { day: 3, what: "Reminder (utility template): offer summary + link", on: addDays(issued, 3) },
    { day: 7, what: p.nextDrop && daysBetween(TODAY, p.nextDrop.dropsOn) <= 60 ? `Value-drop reminder: “your PARF rebate falls by ${fmt(p.nextDrop.amount)} on ${fmtDate(p.nextDrop.dropsOn)}”` : "Check-in: any questions? Offer still open", on: addDays(issued, 7) },
    { day: 12, what: "Final reminder: 2 days left on this offer", on: addDays(issued, 12) },
    { day: 14, what: "Offer expires → status Closed-Expired; any later reply is routed to ops for repricing", on: expiry }
  ];
  const status = S.ownerView === "confirmed" ? ["ok","Accepted · handover booked"] : S.counter ? ["human","Counter-offer · back on the desk"] : S.notNowReason ? ["neutral","Open · owner waiting"] : ["ai","Issued · awaiting response"];
  return `<div class="stage-head"><div class="lead"><h1>6 · The Live Quote Card — the bold change</h1><p>Left is what the owner opens from the WhatsApp link: a breakdown they can verify, honest countdowns driven by LTA dates, and one-tap actions. Right is what Exclusive Global sees in return — every open and tap becomes an intent signal, and follow-up runs on its own.</p></div><div class="actions"><span class="pill ${status[0]}">${status[1]}</span></div></div>
  <div class="grid phone-side">
    <div>${phone("Offer · tap-to-act", inner, false)}</div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="panel-h"><h2>Buyer-intent score</h2><span class="pill ${S.intent >= 70 ? "human" : S.intent >= 40 ? "ai" : "neutral"}">${S.intent >= 70 ? "Hot" : S.intent >= 40 ? "Warm" : "Cold"} · ${S.intent}/100</span></div><div class="panel-b"><div class="gauge ${S.intent >= 70 ? "hot" : ""}"><i style="width:${S.intent}%"></i></div><ol class="timeline" style="margin-top:12px">${S.intentLog.slice().reverse().map(e => `<li class="ai"><span><span class="ts tnum">${e.ts}</span> · +${e.points} ${esc(e.why)}</span></li>`).join("")}</ol></div></div>
      <div class="panel"><div class="panel-h"><h2>Automated follow-up</h2><span class="pill ai">Intervals configurable</span></div><div class="panel-b table-wrap" style="padding:0 8px"><table class="tbl" style="min-width:0"><thead><tr><th>Day</th><th>When</th><th>What goes out</th></tr></thead><tbody>${schedule.map(s => `<tr><td class="tnum">+${s.day}</td><td>${fmtDate(s.on)}</td><td style="white-space:normal">${s.what}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h2>Deal record</h2><span class="pill neutral">Replaces the Google Sheet row</span></div><div class="panel-b table-wrap" style="padding:0 8px"><table class="tbl" style="min-width:0"><tbody>
        <tr><td>Enquiry</td><td>${fmtDate(TODAY)} · WhatsApp</td><td class="pill ok">Done</td></tr>
        <tr><td>Quote issued</td><td>${fmt(t.total)} · valid to ${fmtDate(expiry)}</td><td class="pill ok">Done</td></tr>
        <tr><td>Handover</td><td>${S.slot ? esc(S.slot) : "—"}</td><td class="pill ${S.slot ? "ok" : "neutral"}">${S.slot ? "Booked" : "Pending"}</td></tr>
        <tr><td>Transfer → deregistration (EPZ)</td><td>Expected ${fmtDate(S.deregDate)}</td><td class="pill neutral">Pending</td></tr>
        <tr><td>Rebate encashment</td><td>${fmt(p.parfRebate + p.coeRebate)}</td><td class="pill neutral">Pending</td></tr>
        <tr><td>Shipment and sale</td><td>${v.demand[0]} · est. ${fmt(ensureComps().expectedSale)}</td><td class="pill neutral">Pending</td></tr>
      </tbody></table></div></div>
    </div>
  </div>
  ${footerNav("desk", null, "")}
  <div class="note" style="margin-top:14px">Demo scope: the owner card and the ops screens are real UI with real rule logic; extraction, WhatsApp delivery, approvals and the deal record are simulated in-browser. The production build connects them to WhatsApp Cloud API (Coexistence), a vision model, and Supabase (Singapore region).</div>`;
}

/* ---------- render + events ---------- */
function render(){
  const id = current();
  stepper();
  const fn = { intake: renderIntake, extract: renderExtract, paper: renderPaper, body: renderBody, desk: renderDesk, card: renderCard }[id];
  $("#stage").innerHTML = fn();
  window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, .chip, .slot"); if (!b) return;
  if (b.dataset.go){ go(b.dataset.go); return; }
  if (b.dataset.next){ S.done[current()] = true; if (b.dataset.next === "desk" && S.bodyOffer === null){ const r = ensureComps(); S.bodyOffer = r.mid; log("ai", `Recommended body offer ${fmt(r.low)}–${fmt(r.high)} (mid ${fmt(r.mid)}, ${r.confidence} confidence) from ${S.compsData.comps.length} comparables and 2 auction references.`); } if (b.dataset.next === "paper"){ const p = paper(); log("ai", `Paper value ${fmt(p.paperValue)} computed: PARF ${fmt(p.parfRebate)} (${p.parfPct}%), COE rebate ${fmt(p.coeRebate)}, road tax refund ${fmt(p.roadTaxRefund)}.`); } go(b.dataset.next); return; }
  if (b.id === "newcar"){ resetState($("#scenario").value); go("intake"); return; }
  if (b.id === "simcode"){ S.accessCode = String(randInt(100000, 999999)); addIntent(10, "Issued an LTA Access Code to Exclusive Global"); log("sys", `LTA Access Code ${S.accessCode} received by SMS; paper value will be pulled from OneMotoring.`); render(); return; }
  if (b.id === "runx"){ S.extracting = true; render(); setTimeout(() => { S.extracting = false; S.extracted = true; log("ai", "Log card extracted: all fields read, 1 low-confidence field resolved by ARF cross-check; owner identity masked."); render(); }, 1100); return; }
  if (b.dataset.cond){ S.vehicle.condition = b.dataset.cond; S.rec = recommendBody(S.vehicle, S.compsData, S.rules); render(); return; }
  if (b.id === "req-approval"){ S.approval.requested = true; S.approval.at = nowTime(); log("human", `Ops changed body offer to ${fmt(S.bodyOffer)} — reason: “${S.overrideReason}”. Sent to manager for approval.`); render(); return; }
  if (b.id === "mgr-approve"){ S.approval.approved = true; S.approval.at = nowTime(); log("human", `Manager approved ${fmt(total().total)} from WhatsApp.`); render(); return; }
  if (b.id === "mgr-reject"){ S.approval.requested = false; log("human", "Manager sent the quote back for revision."); render(); return; }
  if (b.id === "issue"){ if (!S.issued){ S.issued = new Date(); S.done.desk = true; log("sys", `Quote ${fmt(total().total)} issued to owner via WhatsApp; Live Quote Card link created; validity 14 days.`); addIntent(5, "Opened the Live Quote Card within 2 minutes"); } go("card"); return; }
  if (b.dataset.owner){
    const a = b.dataset.owner;
    if (a === "accept"){ S.ownerView = "accept"; addIntent(30, "Tapped “Accept and pick a handover slot”"); }
    else if (a === "confirm"){ S.ownerView = "confirmed"; addIntent(30, "Confirmed a handover slot"); log("sys", `Owner accepted and booked handover: ${S.slot}. Deal moved to Accepted; ops notified.`); }
    else if (a === "higher"){ S.ownerView = "higher"; addIntent(15, "Tapped “I have a higher offer”"); }
    else if (a === "sendshot"){ S.counter = round100(S.bodyOffer + paper().paperValue + randInt(300, 900)); addIntent(10, "Shared a competitor’s offer"); log("ai", `Competitor offer ${fmt(S.counter)} read from screenshot (confidence 0.93); routed to Quote Desk for repricing.`); }
    else if (a === "notnow"){ S.ownerView = "notnow"; addIntent(5, "Tapped “Not now” — still engaged"); }
    else S.ownerView = "card";
    render(); return;
  }
  if (b.dataset.slot){ S.slot = b.dataset.slot; render(); return; }
  if (b.dataset.reason){ S.notNowReason = b.dataset.reason; addIntent(5, `Gave a reason: ${b.dataset.reason}`); log("sys", `Owner response: Not now — ${b.dataset.reason}. Follow-up schedule adjusted.`); render(); return; }
});
document.addEventListener("change", e => {
  const el = e.target; const v = S.vehicle;
  if (el.id === "scenario"){ resetState(el.value); go("intake"); return; }
  if (el.id === "redact"){ S.redacted = el.checked; $(".logcard")?.classList.toggle("redacted", S.redacted); return; }
  const num = () => Math.max(0, Number(el.value) || 0);
  const map = {
    "f-reg": () => { v.regDate = parseISO(el.value); v.parfExpiry = addYears(v.regDate, 10); if (!v.renewedOn) v.coeExpiry = addYears(v.regDate, 10); },
    "f-dereg": () => { S.deregDate = parseISO(el.value); },
    "f-arf": () => { v.arfPaid = num(); }, "f-ves": () => { v.vesRebate = num(); }, "f-qp": () => { v.coeQP = num(); },
    "f-coe": () => { v.coeExpiry = parseISO(el.value); }, "f-rt": () => { v.roadTaxExpiry = parseISO(el.value); }, "f-rta": () => { v.roadTaxAnnual = num(); },
    "f-parf": () => { v.parfEligible = el.checked; }, "f-plate": () => { S.retainPlate = el.checked; }, "q-plate": () => { S.retainPlate = el.checked; },
    "r-miles": () => { S.rules.perTenK = num(); }, "r-demand": () => { S.rules.demandPct = num(); }, "r-spread": () => { S.rules.spread = num(); }, "r-fair": () => { S.rules.fairDeduct = num(); }, "r-poor": () => { S.rules.poorDeduct = num(); },
    "q-body": () => { S.bodyOffer = num(); }, "q-reason": () => { S.overrideReason = el.value; }
  };
  if (map[el.id]){ map[el.id](); if (el.id.startsWith("r-")) S.rec = recommendBody(S.vehicle, S.compsData, S.rules); if (el.id.startsWith("f-")) log("human", `Ops edited ${el.previousElementSibling ? el.previousElementSibling.textContent : el.id} on the paper-value screen.`); const focusId = el.id; render(); const again = document.getElementById(focusId); if (again && again.type !== "checkbox") again.focus(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.id === "q-reason"){ S.overrideReason = el.value; const btn = $("#req-approval"); if (btn) btn.disabled = !el.value.trim(); } });
window.addEventListener("hashchange", () => { try { const h = location.hash.replace("#",""); if (STAGES.some(s => s.id === h) && h !== CURRENT){ CURRENT = h; render(); } } catch (e) {} });
setInterval(() => { $$("[data-cd]").forEach(el => { const big = el.querySelector(".big"); if (big) big.textContent = cdParts(Number(el.dataset.cd) - Date.now()); }); }, 1000);

resetState("typical");
try { if (!location.hash) history.replaceState(null, "", "#intake"); } catch (e) {}
render();
</script>
</body>
</html>
